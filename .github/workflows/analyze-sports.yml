name: Analizar deportes durante 3 horas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-predictor
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Abrir proyecto
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -q -o sports-predictor-github.zip -d proyecto
          echo "=== CONTENIDO REAL DEL ZIP ==="
          find proyecto -maxdepth 3 -type f | sort

      - name: Usar archivos actualizados
        run: |
          echo "Archivos externos disponibles:"
          find sports_predictor -maxdepth 1 -type f 2>/dev/null | sort || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Localizar proyecto
        run: |
          echo "=== REQUIREMENTS ENCONTRADO ==="
          find proyecto -name requirements.txt -type f -print
          echo "=== CONFIG ENCONTRADO ==="
          find proyecto -name config.json -type f -print
          echo "=== MAIN ENCONTRADO ==="
          find proyecto -path "*/sports_predictor/main.py" -type f -print

      - name: Ver estructura
        run: |
          find proyecto -maxdepth 4 -type f | sort
