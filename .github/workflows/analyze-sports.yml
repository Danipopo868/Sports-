name: Analizar deportes durante 3 horas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-predictor
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:

      # ======================================================
      # DESCARGAR REPOSITORIO
      # ======================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # COMPROBAR ARCHIVOS
      # ======================================================

      - name: Verificar proyecto
        run: |
          echo "=== ARCHIVOS ==="
          find . -maxdepth 3 -type f | sort

          echo "=== COMPROBAR PYTHON ==="
          python -m py_compile \
            sports_predictor/api.py \
            sports_predictor/engine.py \
            sports_predictor/history.py \
            sports_predictor/main.py \
            sports_predictor/mlb.py \
            sports_predictor/report.py \
            streamlit_app.py


      # ======================================================
      # CREAR CARPETAS NECESARIAS
      # ======================================================

      - name: Crear carpetas
        run: |
          mkdir -p reports
          mkdir -p dashboard_data


      # ======================================================
      # ANALIZAR DURANTE 3 HORAS
      # ======================================================

      - name: Ejecutar Sports Predictor
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m sports_predictor.main \
            --duration-minutes 180 \
            --interval-minutes 15


      # ======================================================
      # GUARDAR REPORTES E HISTORIAL
      # ======================================================

      - name: Guardar resultados en GitHub
        if: always()
        run: |
          git config user.name "sports-predictor-bot"
          git config user.email "sports-predictor-bot@users.noreply.github.com"

          git add reports/ dashboard_data/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
            exit 0
          fi

          git commit -m "Actualizar análisis deportivo e historial"

          git pull --rebase origin main || true

          git push origin main
