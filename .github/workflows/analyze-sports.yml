name: Analizar deportes durante 3 horas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-predictor
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar sintaxis
        run: |
          python -m py_compile sports_predictor/main.py
          python -m py_compile sports_predictor/engine.py
          python -m py_compile sports_predictor/api.py
          python -m py_compile sports_predictor/mlb.py
          python -m py_compile sports_predictor/report.py

      - name: Ejecutar durante 180 minutos
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python -m sports_predictor.main --duration-minutes 180 --interval-minutes 15

      - name: Mostrar resultado
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-deportivo
          path: reports/
          retention-days: 14
