name: Analizar deportes durante 3 horas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-predictor
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Abrir proyecto
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -q -o sports-predictor-github.zip -d proyecto

      - name: Usar archivos actualizados
        run: |
          if [ -f sports_predictor/main.py ]; then
            cp sports_predictor/main.py proyecto/sports-predictor-github/sports_predictor/main.py
          fi

          if [ -f sports_predictor/engine.py ]; then
            cp sports_predictor/engine.py proyecto/sports-predictor-github/sports_predictor/engine.py
          fi

          if [ -f mlb.py ]; then
            cp mlb.py proyecto/sports-predictor-github/sports_predictor/mlb.py
          fi

          if [ -f Engine.py ]; then
            cp Engine.py proyecto/sports-predictor-github/sports_predictor/engine.py
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar cálculos
        working-directory: proyecto/sports-predictor-github
        run: python -m unittest discover -s tests -v

      - name: Ejecutar analisis y actualizar Streamlit
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          END=$((SECONDS + 10800))
          SCAN=0

          while [ $SECONDS -lt $END ]; do
            SCAN=$((SCAN + 1))

            echo "========================================"
            echo "ESCANEO #$SCAN"
            echo "========================================"

            cd "$GITHUB_WORKSPACE/proyecto/sports-predictor-github"

            python -m sports_predictor.main \
              --once \
              --output "$GITHUB_WORKSPACE/proyecto/sports-predictor-github/reports"

            cd "$GITHUB_WORKSPACE"

            mkdir -p dashboard_data

            if [ -f proyecto/sports-predictor-github/dashboard_data/state.json ]; then
              cp proyecto/sports-predictor-github/dashboard_data/state.json dashboard_data/state.json

              git add dashboard_data/state.json

              if ! git diff --cached --quiet; then
                git commit -m "Actualizar dashboard deportivo"
                git pull --rebase origin main
                git push origin HEAD:main
              fi
            else
              echo "ERROR: no se genero dashboard_data/state.json"
            fi

            if [ $SECONDS -lt $END ]; then
              sleep 900
            fi
          done

      - name: Mostrar resultado
        if: always()
        working-directory: proyecto/sports-predictor-github
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-deportivo
          path: proyecto/sports-predictor-github/reports/
          retention-days: 14
