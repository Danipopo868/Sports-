name: Actualizar resultados deportivos

on:
  workflow_dispatch:

  schedule:
    # Revisa cada hora.
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: sports-results
  cancel-in-progress: false

jobs:
  resultados:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisar resultados pendientes
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m sports_predictor.results

      - name: Guardar GANADAS y PERDIDAS
        run: |
          git config user.name "sports-predictor-bot"
          git config user.email "sports-predictor-bot@users.noreply.github.com"

          git add dashboard_data/prediction_history.json

          if git diff --cached --quiet; then
            echo "No hay resultados nuevos."
            exit 0
          fi

          git commit -m "Actualizar resultados deportivos"

          git pull --rebase origin main
          git push origin main
